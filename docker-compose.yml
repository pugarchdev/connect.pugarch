version: '3.8'

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/whatsapp_chatbot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change_this_to_a_secure_jwt_secret_min_32_characters
      - ALLOW_EMPTY_USERS_ON_STARTUP=true
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data:
