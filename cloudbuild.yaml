# ==============================================================================
# Google Cloud Build Pipeline - PugArch Connect Unified Portal
#
# Complete CI/CD Pipeline:
# 1. Pull previous image for Docker layer caching (acceleration)
# 2. Build multi-stage Docker image (backend TypeScript + frontend Next.js)
# 3. Push immutable commit SHA tag and 'latest' tag to Artifact Registry
# 4. Deploy immutable release to Google Cloud Run with zero-downtime revision
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Pull the latest cached image to accelerate Docker layer builds
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest || exit 0

  # ----------------------------------------------------------------------------
  # Step 2: Build the unified container with layer cache & build arguments
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 3: Push both the immutable commit SHA tag and the latest tag
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push-sha'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'

  # ----------------------------------------------------------------------------
  # Step 4: Deploy the immutable image tag to Google Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'cloud-run-deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--timeout'
      - '300s'
      - '--update-env-vars'
      - 'NODE_ENV=production,FRONTEND_URL=https://connect.pugarch.in'

# Register output images for Google Cloud Artifact Registry provenance & security scanning
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest'

# Customizable substitution variables with production-ready defaults
substitutions:
  _REGION: 'asia-southeast1'
  _REPOSITORY: 'pugarch-repo'
  _SERVICE_NAME: 'connect-pugarch'
  _IMAGE_NAME: 'connect-pugarch'
  _API_URL: '/api'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '10'
  _MEMORY: '2Gi'
  _CPU: '2'

options:
  # Use high-CPU machine for fast Next.js & TypeScript compilation
  machineType: 'E2_HIGHCPU_8'
  # Direct logs to Google Cloud Logging
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
